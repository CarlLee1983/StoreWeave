# Build with STOREWEAVE_RELEASE=notes. Secrets remain outside this file.
version: 1
store:
  id: notes-site
  name: Notes
  locale: en
  timezone: UTC
database:
  url: ${STOREWEAVE_DATABASE_URL}
  autoMigrate: false
http:
  publicUrl: http://localhost:3001
  cors:
    # Empty keeps CORS and its automatic OPTIONS route disabled.
    allowedOrigins: []
    credentials: false
# Defaults to a private local object store at <paths.dataDir>/storage.
# For multi-host deployments, use an S3-compatible bucket instead; credentials
# stay in the secret provider, never in this file.
storage:
  driver: local
  maxUploadBytes: 20971520
  signedUrlTtlSeconds: 300
# Mail is off until SMTP is intentionally configured.  There is no production
# mock fallback: a failed SMTP send is recorded for operator handling.
mail:
  transport: disabled
# 密碼重設與信箱驗證連結是簽發值，沒有金鑰就沒有這些流程（ADR 0038、ADR 0042）。
# 產生一把：openssl rand -hex 32
security:
  signingKeys:
    - id: k1
      secretRef: STOREWEAVE_SIGNING_KEY_K1
# API token 由 `storeweave token:create` 簽發，設定檔裡沒有它們（ADR 0043）。
extensions: []
paths:
  dataDir: /var/lib/notes
  backupDir: /var/lib/notes/backups
secrets:
  provider: file
  file: /etc/notes/notes.env
shutdown:
  timeoutMs: 25000
