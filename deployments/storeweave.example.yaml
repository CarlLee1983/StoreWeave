# yaml-language-server: $schema=./base.schema.json
# Build with STOREWEAVE_RELEASE=base. Secrets remain outside this file.
version: 1
store:
  id: base-site
  name: Base site
  locale: en
  timezone: UTC
database:
  url: ${STOREWEAVE_DATABASE_URL}
  autoMigrate: false
http:
  publicUrl: http://localhost:3000
  cors:
    # Empty keeps CORS and its automatic OPTIONS route disabled.
    allowedOrigins: []
    credentials: false
# Defaults to a private local object store at <paths.dataDir>/storage.
# For multi-host deployments, use an S3-compatible bucket instead; credentials
# stay in the secret provider, never in this file.
storage:
  driver: local
  maxUploadBytes: 20971520
  signedUrlTtlSeconds: 300
auth:
  tokens: []
extensions: []
secrets:
  provider: file
  file: /etc/storeweave/storeweave.env
shutdown:
  timeoutMs: 25000
