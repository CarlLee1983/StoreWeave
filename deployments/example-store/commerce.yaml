# StoreWeave 單站設定檔。
# 機密一律不寫在這裡：用 ${VAR} 參照環境變數，值放在 commerce.env 或 Secret Provider。
version: 1

store:
  id: example-store
  name: 織日選物 · Woven Day
  currency: TWD
  locale: zh-TW
  timezone: Asia/Taipei
  supportEmail: service@wovenday.tw

http:
  host: 0.0.0.0
  port: 3000
  publicUrl: ${COMMERCE_PUBLIC_URL:-http://localhost:3000}
  cors:
    # Browser origins only; this is not derived from publicUrl.
    allowedOrigins: []
    credentials: false
  trustProxy: false

database:
  url: ${DATABASE_URL}
  poolSize: 10
  ssl: false
  # 正式環境建議關閉，改由 `commerce migrate` 明確執行
  autoMigrate: false

worker:
  enabled: true
  concurrency: 4
  pollIntervalMs: 1000
  outboxBatchSize: 100
  staleLockSeconds: 300

theme:
  id: default
  options:
    accentColor: "#8C3E28"
    tagline: 日日相伴的器物與手織生活工藝
    showSku: true

admin:
  enabled: true
  basePath: /admin

mcp:
  enabled: true
  path: /mcp

security:
  signingKeys:
    - id: k1
      secretRef: COMMERCE_SIGNING_KEY_K1

# 機器對機器的 API token 不在設定檔裡：用 `commerce token:create` 簽發（ADR 0043）。

extensions:
  - id: mock-payment
    enabled: true
    config:
      autoApprove: true
      declineAboveCents: 0
  - id: demo-erp
    enabled: true
    config:
      endpoint: mock://demo-erp
      companyCode: DEMO
      warehouseCode: MAIN
      maxAttempts: 5
  - id: mcp
    enabled: true
    config:
      serverName: example-store-commerce
      enabledTools:
        - search_products
        - get_order
        - get_sales_summary
        - adjust_inventory

logging:
  level: info
  destination: stdout

# Local objects share the commerce-data volume and survive release replacement.
# S3-compatible deployments may replace this with driver: s3 plus bucket,
# endpoint, and secret references; do not make the bucket publicly readable.
storage:
  driver: local
  maxUploadBytes: 20971520
  signedUrlTtlSeconds: 300

# Enable only with a real SMTP account. Keep credentials in commerce.env; the
# shipped demo remains disabled so it starts without SMTP credentials.
mail:
  transport: disabled

paths:
  dataDir: /var/lib/commerce
  backupDir: /var/lib/commerce/backups

secrets:
  provider: file
  file: /etc/commerce/commerce.env
