# Base-only: docker compose -f compose.base.yaml up -d --build
name: storeweave-base
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: storeweave
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-base-dev-password}
      POSTGRES_DB: storeweave
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storeweave -d storeweave"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        STOREWEAVE_RELEASE: base
    image: ${STOREWEAVE_IMAGE:-storeweave/base:local}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      STOREWEAVE_DATABASE_URL: postgres://storeweave:${POSTGRES_PASSWORD:-base-dev-password}@postgres:5432/storeweave
      STOREWEAVE_ADMIN_TOKEN: ${STOREWEAVE_ADMIN_TOKEN:-}
      STOREWEAVE_AUTO_MIGRATE: "true"
    volumes:
      - ${STOREWEAVE_CONFIG_PATH:-./deployments/storeweave.example.yaml}:/etc/storeweave/storeweave.yaml:ro
      - storeweave-data:/var/lib/storeweave
    ports:
      - "127.0.0.1:${STOREWEAVE_PORT:-3000}:3000"
    command: ["api"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
  worker:
    image: ${STOREWEAVE_IMAGE:-storeweave/base:local}
    depends_on:
      api:
        condition: service_healthy
    environment:
      STOREWEAVE_DATABASE_URL: postgres://storeweave:${POSTGRES_PASSWORD:-base-dev-password}@postgres:5432/storeweave
      STOREWEAVE_ADMIN_TOKEN: ${STOREWEAVE_ADMIN_TOKEN:-}
    volumes:
      - ${STOREWEAVE_CONFIG_PATH:-./deployments/storeweave.example.yaml}:/etc/storeweave/storeweave.yaml:ro
      - storeweave-data:/var/lib/storeweave
    command: ["worker"]
    restart: unless-stopped
volumes:
  postgres-data:
  storeweave-data:
