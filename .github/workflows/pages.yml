name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# 同一時間只部署一次；進行中的部署不取消，讓它完成。
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # 與 ci.yml 及 package.json 的 engines / packageManager 對齊。
  NODE_VERSION: '22.17.1'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
