name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 全部的 job 都用同一組 toolchain 版本，與 package.json 的 engines / packageManager 對齊。
  NODE_VERSION: '22.17.1'

jobs:
  # 不需要 Docker 的快檢查：型別與單元 / 架構測試。
  check:
    name: typecheck + unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm/setup 一步裝好 pnpm 與 Node runtime，取代 action-setup + setup-node 兩步。
      # pnpm 的版本它自己去讀 package.json 的 packageManager，這裡不重複宣告一次。
      # install: false 是刻意的——安裝留在下一行明寫，`--frozen-lockfile` 才看得見。
      - uses: pnpm/setup@v2
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      # The cache is deliberately restored by a broad prefix: TypeScript
      # invalidates changed source files itself, while unchanged projects keep
      # their semantic graph across CI runs.
      - uses: actions/cache@v6
        with:
          path: node_modules/.cache/*.tsbuildinfo
          key: tsbuild-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig*.json', 'apps/admin/tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            tsbuild-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig*.json', 'apps/admin/tsconfig.json') }}-
      # 每一步都是 make verify 的一個子目標：完成定義只有 Makefile 一份，
      # CI 只是把它拆成平行 job 跑。
      - run: make typecheck
      - run: make typecheck-admin
      - run: make test
      # 後台的 React 元件測試跑在 jsdom，不需要 Docker，和上面同一個 job 就夠。
      - run: make test-admin

  # Testcontainers 會自己起 PostgreSQL，runner 內建的 Docker 就夠。
  integration:
    name: integration shard ${{ matrix.shard }}/2 (postgres)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: make test-integration-shard-${{ matrix.shard }}

  # 保留既有 required-check 名稱；兩個 shard 都成功才會通過。
  integration-summary:
    name: integration (postgres)
    needs: integration
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.integration.result }}' = success

  # 映像在 Docker 內建置，所以這裡不需要 pnpm install；
  # 但 smoke.sh 的 jqr() 用 node 解析回應，runner 上仍要有 node。
  smoke-docker-matrix:
    name: smoke docker (${{ matrix.release }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: [base, commerce]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: docker/setup-buildx-action@v3
      - uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ runner.os }}-${{ matrix.release }}-${{ github.sha }}
          restore-keys: |
            buildx-${{ runner.os }}-${{ matrix.release }}-
      - name: Build Docker smoke image with layer cache
        run: |
          cache_from=()
          if [ -f /tmp/.buildx-cache/index.json ]; then
            cache_from=(--cache-from type=local,src=/tmp/.buildx-cache)
          fi
          docker buildx build --load "${cache_from[@]}" \
            --cache-to type=local,dest=/tmp/.buildx-cache-next,mode=max \
            --build-arg STOREWEAVE_RELEASE=${{ matrix.release }} \
            --build-arg STOREWEAVE_SOURCE_REVISION=${{ github.sha }} \
            --tag storeweave/${{ matrix.release }}:ci-smoke .
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-next /tmp/.buildx-cache
      - name: Run checksum-bound smoke
        env:
          STOREWEAVE_RELEASE: ${{ matrix.release }}
          STOREWEAVE_IMAGE: storeweave/${{ matrix.release }}:ci-smoke
          STOREWEAVE_SKIP_BUILD: 'true'
          STOREWEAVE_SOURCE_REVISION: ${{ github.sha }}
          SMOKE_WORK_DIR: ${{ runner.temp }}/docker-smoke-${{ matrix.release }}
          STOREWEAVE_SMOKE_EVIDENCE: ${{ runner.temp }}/docker-smoke-${{ matrix.release }}/evidence.json
        run: |
          mkdir -p "$SMOKE_WORK_DIR"
          bash scripts/smoke-docker.sh
      - uses: actions/upload-artifact@v7
        with:
          name: docker-smoke-${{ matrix.release }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/docker-smoke-${{ matrix.release }}/evidence.json
            ${{ runner.temp }}/docker-smoke-${{ matrix.release }}/docker-build-info.json
            ${{ runner.temp }}/docker-smoke-${{ matrix.release }}/docker-release-manifest.json

  smoke-docker:
    name: smoke (docker compose)
    needs: smoke-docker-matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.smoke-docker-matrix.result }}' = success

  # 在乾淨的 Debian 容器裡裝 tarball 跑完三條流程。
  # 這個 job 會自己建 release：CI 上永遠是全新 checkout，不會重用過期產物。
  smoke-native-matrix:
    name: smoke native (${{ matrix.release }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: [base, commerce]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      # 固定版本的 Node runtime 會被下載進 .cache，跨次執行快取起來。
      - uses: actions/cache@v6
        with:
          path: .cache
          key: node-runtime-${{ env.NODE_VERSION }}-x64
      - name: Run checksum-bound smoke
        env:
          STOREWEAVE_RELEASE: ${{ matrix.release }}
          STOREWEAVE_SOURCE_REVISION: ${{ github.sha }}
          STOREWEAVE_BUILD_DIR: ${{ runner.temp }}/native-build-${{ matrix.release }}
          STOREWEAVE_RELEASE_DIR: ${{ runner.temp }}/native-release-${{ matrix.release }}
          STOREWEAVE_SMOKE_EVIDENCE: ${{ runner.temp }}/native-evidence-${{ matrix.release }}.json
        run: pnpm smoke:native
      - uses: actions/upload-artifact@v7
        with:
          name: native-smoke-${{ matrix.release }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/native-evidence-${{ matrix.release }}.json
            ${{ runner.temp }}/native-release-${{ matrix.release }}/*.tar.gz
            ${{ runner.temp }}/native-build-${{ matrix.release }}/build-info.json
            ${{ runner.temp }}/native-build-${{ matrix.release }}/release-manifest.json

  smoke-native:
    name: smoke (native tarball)
    needs: smoke-native-matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.smoke-native-matrix.result }}' = success
